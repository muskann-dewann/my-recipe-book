<style>
/* Layout: iOS-style app. Home = large title, search, segmented filter, photo cards. Recipe = translucent nav bar, full-bleed photo, facts card, sticky segmented jump, grouped ingredient list with weight stepper, step cards with timers. */
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --fill: #F0F0F5;
  --fill2: #E5E5EA;
  --text: #1C1C1E;
  --text2: #6E6E73;
  --text3: #8E8E93;
  --sep: rgba(60, 60, 67, .14);
  --accent: #F26B1D;
  --accent-text: #C2410C;
  --tint: rgba(242, 107, 29, .12);
  --green: #34C759;
  --nonveg: #B3261E;
  --veg: #1E8E3E;
  --star: #FF9F0A;
  --navbg: rgba(242, 242, 247, .8);
  --scrim: rgba(0, 0, 0, .35);
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 10px 28px -14px rgba(0, 0, 0, .18);
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --card: #1C1C1E; --fill: #2C2C2E; --fill2: #3A3A3C;
    --text: #F5F5F7; --text2: #AEAEB2; --text3: #8E8E93; --sep: rgba(84, 84, 88, .55);
    --accent: #FF8A3D; --accent-text: #FF9F5A; --tint: rgba(255, 138, 61, .16);
    --green: #30D158; --nonveg: #FF6B5E; --veg: #4CD964; --star: #FFB340;
    --navbg: rgba(0, 0, 0, .72); --scrim: rgba(0, 0, 0, .6); --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 16px/1.5 var(--font); letter-spacing: -0.01em;
  padding: env(safe-area-inset-top, 0px) 16px calc(120px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.view { max-width: 1080px; margin-inline: auto; animation: enter .35s cubic-bezier(.2, .8, .2, 1); }
.view.recipe { max-width: 760px; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- shared controls ---------- */
.icon-btn { position: relative; display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--fill); color: var(--text); transition: transform .15s, background .2s; }
.icon-btn:active { transform: scale(.92); }
.icon-btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--accent); color: #fff; font-size: .68rem; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--bg); }
.badge[data-n="0"] { display: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: 12px; padding: 11px 16px; font-size: .94rem; font-weight: 600; transition: transform .15s, background .2s, color .2s; text-decoration: none; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-tinted { background: var(--tint); color: var(--accent-text); }
.btn-tinted[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.btn-plain { background: var(--fill); color: var(--text); }
.btn svg.i { width: 18px; height: 18px; }
.text-btn { border: 0; background: none; padding: 6px 0; color: var(--accent-text); font-size: .9rem; font-weight: 600; }
.segmented { display: flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--fill2); }
.segmented button { flex: 1; border: 0; background: transparent; border-radius: 8px; padding: 7px 12px; font-size: .88rem; font-weight: 600; color: var(--text); white-space: nowrap; transition: background .2s, box-shadow .2s; }
.segmented button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04); }
.stars { display: inline-flex; gap: 1px; color: var(--star); font-size: .9rem; letter-spacing: 0; }
.stars .off { color: var(--fill2); }
.vtag { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; font-weight: 600; color: var(--nonveg); }
.vtag.veg { color: var(--veg); }
.vtag i { width: 13px; height: 13px; border: 1.5px solid currentColor; border-radius: 3px; display: grid; place-items: center; }
.vtag i::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.dot-sep { color: var(--text3); }

/* ---------- home ---------- */
.home-top { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; min-height: 52px; }
.home-top .kicker { font-size: .82rem; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .04em; }
.large-title { font-size: 2.15rem; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; margin-top: 2px; }
.subtitle { color: var(--text2); margin-top: 6px; font-size: .98rem; max-width: 46ch; }
.search { position: relative; display: block; margin-top: 18px; }
.search input { width: 100%; border: 0; background: var(--fill2); border-radius: 12px; padding: 10px 14px 10px 38px; font-size: 1rem; color: var(--text); outline: none; }
.search input::placeholder { color: var(--text3); }
.search svg.i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text3); }
.home-filters { margin-top: 12px; max-width: 420px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; margin-top: 20px; }
.card { display: flex; flex-direction: column; background: var(--card); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); cursor: pointer; transition: transform .25s cubic-bezier(.2, .8, .2, 1); animation: enter .45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 60ms); }
.card:active { transform: scale(.98); }
@media (hover: hover) { .card:hover { transform: translateY(-3px); } .card:hover .card-photo img { transform: scale(1.03); } }
.card-photo { overflow: hidden; aspect-ratio: 4 / 3; background: var(--fill); }
.card-photo img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.card-body { flex: 1; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .78rem; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .04em; }
.card h2 { font-size: 1.28rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.card-tag { color: var(--text2); font-size: .9rem; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--text2); font-size: .86rem; margin: 4px 0 10px; }
.card-meta span { display: inline-flex; align-items: center; gap: 5px; }
.card-meta svg.i { width: 16px; height: 16px; color: var(--text3); }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: auto; padding-top: 10px; border-top: .5px solid var(--sep); }
.card-foot .when { display: flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--text3); flex-wrap: wrap; }
.add-btn { display: inline-flex; align-items: center; gap: 5px; border: 0; border-radius: 999px; padding: 6px 12px; background: var(--tint); color: var(--accent-text); font-size: .8rem; font-weight: 600; white-space: nowrap; transition: background .2s, color .2s, transform .15s; }
.add-btn:active { transform: scale(.94); }
.add-btn svg.i { width: 15px; height: 15px; stroke-width: 2.2; }
.add-btn[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.empty { color: var(--text2); padding: 30px 0; text-align: center; }

/* ---------- recipe ---------- */
.navbar {
  position: sticky; top: 0; z-index: 30; margin-inline: -16px; padding: 8px 12px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  background: var(--navbg); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid transparent; transition: border-color .2s;
}
.navbar.scrolled { border-bottom-color: var(--sep); }
.nav-back { justify-self: start; display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; color: var(--accent-text); font-size: 1.02rem; font-weight: 500; padding: 6px 4px; }
.nav-back svg.i { width: 22px; height: 22px; stroke-width: 2.2; }
.nav-title { font-weight: 600; font-size: .98rem; max-width: 46vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .2s; }
.navbar.scrolled .nav-title { opacity: 1; }
.nav-actions { justify-self: end; display: flex; gap: 8px; }
.nav-actions .icon-btn { width: 34px; height: 34px; }
.nav-actions svg.i { width: 18px; height: 18px; }
.r-hero { margin: 4px -16px 0; aspect-ratio: 4 / 3; overflow: hidden; background: var(--fill); }
.r-hero img { width: 100%; height: 100%; object-fit: cover; }
@media (min-width: 640px) { .r-hero { margin: 8px 0 0; border-radius: 22px; aspect-ratio: 16 / 10; } }
.r-head { padding: 18px 2px 4px; display: grid; gap: 6px; }
.r-course { font-size: .8rem; font-weight: 600; color: var(--accent-text); text-transform: uppercase; letter-spacing: .05em; }
.r-head h1 { font-size: clamp(1.75rem, 6.5vw, 2.3rem); font-weight: 700; letter-spacing: -0.025em; line-height: 1.12; }
.r-tag { color: var(--text2); font-size: 1rem; }
.r-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 4px; font-size: .86rem; color: var(--text2); }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--card); border-radius: 18px; margin-top: 14px; box-shadow: var(--shadow); }
.fact { padding: 12px 6px; text-align: center; display: grid; justify-items: center; gap: 2px; min-width: 0; }
.fact + .fact { border-left: .5px solid var(--sep); }
.fact > svg.i { color: var(--accent); width: 20px; height: 20px; margin-bottom: 2px; }
.fact span { font-size: .7rem; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
.fact b { font-size: .92rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.r-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.jumpbar { position: sticky; top: 52px; z-index: 20; margin: 16px -16px 0; padding: 8px 16px; background: var(--navbg); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); }
.sec { scroll-margin-top: 110px; padding-top: 18px; }
.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 0 2px 10px; }
.sec-head h2 { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; }
.sec-head .count { font-size: .86rem; color: var(--text2); font-variant-numeric: tabular-nums; }
.group { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.group + .group { margin-top: 12px; }
.stepper-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px 12px 16px; }
.stepper-row .lbl { display: grid; }
.stepper-row .lbl b { font-weight: 600; font-size: .98rem; }
.stepper-row .lbl small { color: var(--text3); font-size: .78rem; }
.stepper { display: inline-flex; align-items: center; background: var(--fill); border-radius: 10px; }
.stepper button { width: 40px; height: 34px; border: 0; background: none; font-size: 1.25rem; line-height: 1; color: var(--text); }
.stepper button:disabled { color: var(--text3); opacity: .5; cursor: default; }
.stepper output { min-width: 62px; text-align: center; font-weight: 600; font-size: .95rem; font-variant-numeric: tabular-nums; border-inline: .5px solid var(--sep); padding: 0 6px; }
.scale-note { padding: 0 16px 12px; font-size: .8rem; color: var(--accent-text); }
.ilist { list-style: none; margin: 0; padding: 0; }
.irow { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; cursor: pointer; }
.ilist li + li .irow::before { content: ""; position: absolute; top: 0; left: 52px; right: 0; border-top: .5px solid var(--sep); }
.irow input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.cb { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--text3); display: grid; place-items: center; transition: background .2s, border-color .2s, transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.cb svg { width: 13px; height: 13px; fill: none; stroke: var(--on-accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .25s .05s; }
.irow input:checked ~ .cb { background: var(--accent); border-color: var(--accent); transform: scale(1.06); }
.irow input:checked ~ .cb svg { stroke-dashoffset: 0; }
.irow input:focus-visible ~ .cb { outline: 2px solid var(--accent); outline-offset: 2px; }
.iname { min-width: 0; font-size: .97rem; }
.iname small { display: block; color: var(--text3); font-size: .78rem; margin-top: 1px; }
.iqty { font-weight: 600; font-size: .95rem; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; max-width: 11rem; }
.irow input:checked ~ .iname, .irow input:checked ~ .iqty { color: var(--text3); text-decoration: line-through; }
.sec-foot { display: flex; justify-content: flex-end; padding: 4px 2px 0; }
.progress { height: 4px; border-radius: 99px; background: var(--fill2); overflow: hidden; margin: 0 2px 12px; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .4s cubic-bezier(.2, .8, .2, 1); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.step { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 14px 14px 16px; display: grid; gap: 10px; transition: opacity .3s; }
.step-head { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.step-head .tile { width: 34px; height: 34px; }
.step-num { width: 30px; height: 30px; border-radius: 50%; background: var(--tint); color: var(--accent-text); display: grid; place-items: center; font-weight: 700; font-size: .9rem; font-variant-numeric: tabular-nums; transition: background .25s, color .25s; }
.step-of { font-size: .72rem; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.step h3 { font-size: 1.06rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
.check { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--text3); background: none; display: grid; place-items: center; transition: background .2s, border-color .2s, transform .3s cubic-bezier(.3, 1.6, .5, 1); }
.check svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity .2s; }
.step.done .check { background: var(--green); border-color: var(--green); transform: scale(1.06); }
.step.done .check svg { opacity: 1; }
.step.done .step-head .tile { background: var(--fill); color: var(--text3); }
.step.done .step-body { opacity: .45; }
.step-body { display: grid; gap: 10px; padding-left: 46px; transition: opacity .3s; }
.uses { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.uses li { background: var(--fill); border-radius: 8px; padding: 4px 9px; font-size: .84rem; line-height: 1.35; color: var(--text); }
.uses b { font-weight: 600; color: var(--accent-text); margin-right: 2px; }
.step-text { font-size: .97rem; line-height: 1.55; color: var(--text); }
.timer-btn { justify-self: start; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; background: var(--tint); color: var(--accent-text); padding: 7px 13px; font-size: .86rem; font-weight: 600; transition: transform .15s; }
.timer-btn:active { transform: scale(.95); }
.timer-btn svg.i { width: 16px; height: 16px; stroke-width: 2; }
.notes { margin-top: 16px; background: var(--card); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
.notes h3 { font-size: .8rem; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 6px; }
.notes h3 svg.i { width: 16px; height: 16px; }
.notes p, .notes li { font-size: .92rem; color: var(--text2); margin-top: 6px; }
.notes ul { margin: 0; padding-left: 18px; }

/* ---------- timer ---------- */
.timers { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50; width: min(440px, calc(100% - 24px)); display: grid; gap: 8px; }
.timer {
  display: flex; align-items: center; gap: 12px;
  background: #1C1C1E; color: #fff; border-radius: 999px; padding: 7px 7px 7px 9px;
  box-shadow: 0 16px 40px -14px rgba(0, 0, 0, .55); animation: tin .35s cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) { .timer { background: #2C2C2E; } }
@keyframes tin { from { transform: translateY(140%); opacity: 0; } to { transform: none; opacity: 1; } }
.ring { width: 40px; height: 40px; flex-shrink: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 4; }
.ring .bg { stroke: rgba(255, 255, 255, .16); }
.ring .fg { stroke: #FF8A3D; stroke-linecap: round; stroke-dasharray: 107; transition: stroke-dashoffset .5s linear; }
.t-info { flex: 1; min-width: 0; display: grid; line-height: 1.2; }
.t-time { font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.t-label { font-size: .76rem; color: rgba(255, 255, 255, .6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-btn { width: 38px; height: 38px; border-radius: 50%; border: 0; display: grid; place-items: center; background: rgba(255, 255, 255, .14); color: #fff; flex-shrink: 0; }
.t-btn.stop { background: #FF453A; }
.t-btn svg.i { width: 17px; height: 17px; stroke-width: 2.2; }
.timer.finished { background: var(--accent); animation: nudge .5s ease 3; }
.timer.finished .t-label { color: rgba(255, 255, 255, .9); }
@keyframes nudge { 0%, 100% { transform: none; } 30% { transform: translateX(-5px); } 70% { transform: translateX(5px); } }

/* ---------- sheets ---------- */
.sheet { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade .25s; }
@keyframes fade { from { opacity: 0; } }
.sheet-panel { width: min(600px, 100%); max-height: 90vh; overflow: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px)); animation: up .35s cubic-bezier(.2, .8, .2, 1); }
@media (min-width: 700px) { .sheet { align-items: center; padding: 20px; } .sheet-panel { border-radius: 18px; } }
@keyframes up { from { transform: translateY(60px); opacity: .6; } to { transform: none; opacity: 1; } }
.grabber { width: 38px; height: 5px; border-radius: 99px; background: var(--fill2); margin: 0 auto 10px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }

}

    '<div class="t-info"><span class="t-time">' + fmt(t.left) + '</span><span class="t-label">' + (t.done ? 'Time is up: ' : '') + esc(t.label) + '</span></div>' +
    (t.done ? '' : '<button class="t-btn" data-tpause aria-label="' + (t.paused ? 'Resume' : 'Pause') + ' timer">' + (t.paused ? I.play : I.pause) + '</button>') +

  var ss = t.closest('[data-scale-step]');
  if (ss && !ss.disabled) {
    var r = byId(current), ws = weights(r), i = ws.indexOf(grams(r)) + (+ss.getAttribute('data-scale-step'));
    if (i < 0 || i >= ws.length) return;
    var y = window.scrollY; state.sc = state.sc || {}; state.sc[r.id] = ws[i];
    if (inList(r.id)) state.list[r.id] = ws[i];
    save(); recipeView(r); window.scrollTo(0, y); return;
  }
  var j = t.closest('[data-jump]'); if (j) { document.getElementById(j.getAttribute('data-jump')).scrollIntoView({ behavior: 'smooth' }); return; }
  var open = t.closest('[data-open]'); if (open) { go(open.getAttribute('data-open')); return; }
  if (t.closest('[data-back]')) { if (lock) setWake(false); go(''); return; }
  var f = t.closest('[data-filter]'); if (f) { filter = f.getAttribute('data-filter'); app.querySelectorAll('[data-filter]').forEach(function (b) { b.setAttribute('aria-pressed', b === f ? 'true' : 'false'); }); document.getElementById('cards').innerHTML = cardsHTML(); return; }
  var tb = t.closest('[data-timer]'); if (tb) { startTimer(+tb.getAttribute('data-timer'), tb.getAttribute('data-label')); return; }
  var sb = t.closest('[data-step]');
  if (sb) {
    var key = sb.getAttribute('data-step'), li = sb.closest('.step'), on = !li.classList.contains('done');
    li.classList.toggle('done', on); sb.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (on) state[key] = 1; else delete state[key];
    save(); updateProgress(on); return;
  }
  var rs = t.closest('[data-reset]');
  if (rs) {
    var root = app.querySelector('[data-recipe]'), rid = root.getAttribute('data-recipe'), kind = rs.getAttribute('data-reset');
    Object.keys(state).forEach(function (k2) { if (k2.indexOf(rid + ':' + kind) === 0) delete state[k2]; });
    save();
    if (kind === 'i') root.querySelectorAll('.irow input').forEach(function (x) { x.checked = false; });
    else root.querySelectorAll('.step').forEach(function (s) { s.classList.remove('done'); s.querySelector('[data-step]').setAttribute('aria-pressed', 'false'); });
    updateProgress(false);
  }
});
app.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.card[data-open]')) { e.preventDefault(); go(e.target.getAttribute('data-open')); }
});
app.addEventListener('change', function (e) {
  var i = e.target; if (!i.matches || !i.matches('input[data-key]')) return;
  var key = i.getAttribute('data-key');
  if (i.checked) state[key] = 1; else delete state[key];
  save(); updateProgress(false);
});
app.addEventListener('input', function (e) {
  if (e.target.id !== 'search') return;
  query = e.target.value;
  document.getElementById('cards').innerHTML = cardsHTML();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSheet(); doneEl.hidden = true; } });

try { current = (location.hash || '').slice(1); } catch (e) { current = ''; }
render();
</script>
