<style>
/* Layout: food-magazine index (masthead, ticker, photo cards in recipe colours) -> recipe spread: photo hero, spec strip, ingredients first, then illustrated animated steps with timers */
:root {
  color-scheme: light;
  --paper: #FFFBF4;
  --ink: #1E1612;
  --muted: #6B5E55;
  --line: rgba(30, 22, 18, .12);
  --tomato: #D63B27;
  --butter: #FFD35A;
  --cream: #FFF4DF;
  --forest: #1F5A43;
  --turmeric: #FFB21E;
  --display: 'Bricolage Grotesque', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --body: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
}
html { background: var(--paper); }
* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 400 15px/1.55 var(--body);
  padding-inline: 16px;
  padding-block: 0 140px;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
.wrap { max-width: 1120px; margin-inline: auto; }
h1, h2, h3 {
  font-family: var(--display); font-weight: 800; font-stretch: 78%;
  letter-spacing: -0.025em; line-height: .95; margin: 0; text-wrap: balance;
}
p { margin: 0; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.eyebrow { font: 700 .74rem/1.2 var(--display); font-stretch: 90%; letter-spacing: .16em; text-transform: uppercase; }
.serif { font-family: var(--serif); font-style: italic; font-weight: 400; }

/* ---------- Stickers ---------- */
.stk {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 15px 7px; border-radius: 999px;
  background: var(--sb, var(--tomato)); color: var(--sf, var(--cream));
  font: 800 .8rem/1 var(--display); font-stretch: 85%; letter-spacing: .07em; text-transform: uppercase;
  border: 3px solid #fff; white-space: nowrap;
  box-shadow: 0 1px 0 rgba(30, 22, 18, .05), 0 10px 18px -10px rgba(30, 22, 18, .55);
  transform: rotate(var(--rot, -4deg));
}
.burst { display: block; width: var(--size, 92px); height: var(--size, 92px); filter: drop-shadow(0 8px 10px rgba(30, 22, 18, .3)); }
.burst-spin { animation: spin 18s linear infinite; }
.burst text { font-family: var(--display); font-weight: 800; font-stretch: 80%; text-transform: uppercase; }

/* ---------- Masthead ---------- */
.mast { position: relative; padding-block: 28px 26px; }
.mast-top { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
.mast-title { position: relative; margin-top: 22px; font-size: clamp(3rem, 14vw, 7.5rem); line-height: .86; letter-spacing: -0.04em; }
.mast-title .ln { display: block; overflow: hidden; padding-bottom: .04em; }
.mast-title .ln > span { display: inline-block; animation: rise .8s cubic-bezier(.2, .8, .2, 1) both; }
.mast-title .ln:nth-child(2) > span { animation-delay: .08s; }
.mast-title .dot { color: var(--tomato); }
.mast-burst { position: absolute; right: -4px; top: 46px; --size: clamp(84px, 20vw, 150px); animation: pop .6s .35s cubic-bezier(.3, 1.6, .5, 1) both; }
.mast-pill { position: absolute; right: clamp(70px, 24vw, 240px); bottom: 2px; --rot: 6deg; animation: pop .6s .5s cubic-bezier(.3, 1.6, .5, 1) both; }
.mast-sub { margin-top: 18px; max-width: 34ch; font-size: clamp(1.1rem, 3.2vw, 1.4rem); line-height: 1.3; }
@media (max-width: 560px) { .mast-pill { position: static; display: inline-flex; margin-top: 14px; } }

.marquee { margin-inline: -16px; background: var(--tomato); color: var(--cream); overflow: hidden; transform: rotate(-1.2deg); margin-block: 10px 30px; border-block: 3px solid var(--ink); }
.marquee .track { display: flex; width: max-content; animation: marquee 26s linear infinite; }
.marquee .track span { display: inline-flex; align-items: center; gap: 22px; padding: 12px 22px 11px 0; font: 800 1.1rem/1 var(--display); font-stretch: 78%; text-transform: uppercase; letter-spacing: .01em; white-space: nowrap; }
.marquee svg { width: 22px; height: 22px; fill: var(--butter); }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 22px; }
.search { position: relative; flex: 1 1 260px; max-width: 420px; }
.search input { width: 100%; padding: 13px 18px 13px 46px; background: #fff; border: 2px solid var(--ink); border-radius: 999px; }
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 17px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid var(--ink); background: transparent; border-radius: 999px; padding: 8px 16px; font-weight: 600; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* ---------- Cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
.card {
  position: relative; display: flex; flex-direction: column;
  background: var(--bg); color: var(--fg);
  border-radius: 30px; padding: 12px; text-decoration: none;
  transition: transform .35s cubic-bezier(.2, .8, .2, 1), box-shadow .35s;
  animation: rise .7s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 90ms + .2s);
}
.card:hover { transform: translateY(-6px) rotate(-.7deg); box-shadow: 0 26px 40px -26px rgba(30, 22, 18, .6); }
.c-photo { position: relative; }
.c-photo img { display: block; width: 100%; max-width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 22px; transition: transform .5s ease; }
.c-photo .stk { position: absolute; left: 12px; top: 12px; }
.c-photo .burst-wrap { position: absolute; right: -8px; bottom: -22px; --size: 82px; }
.card:hover .c-photo .stk { animation: wiggle .5s ease; }
.c-body { display: flex; flex-direction: column; gap: 10px; padding: 18px 8px 8px; flex: 1; }
.c-body h2 { font-size: clamp(1.6rem, 5.5vw, 2rem); padding-right: 64px; }
.c-tag { font-family: var(--serif); font-style: italic; font-size: 1.05rem; line-height: 1.25; opacity: .92; }
.specs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 8px 0 0; padding-top: 14px; border-top: 2px solid var(--rule); }
.specs div { min-width: 0; }
.specs div + div { padding-left: 12px; border-left: 2px solid var(--rule); }
.specs dt { font: 700 .66rem/1.2 var(--display); letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
.specs dd { margin: 4px 0 0; font-weight: 700; font-variant-numeric: tabular-nums; }
.c-cta { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; font-weight: 700; }
.c-cta svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .25s; }
.card:hover .c-cta svg { transform: translateX(4px); }
.empty { padding-block: 30px; font-size: 1.1rem; color: var(--muted); }

/* ---------- Recipe page ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-inline: -16px; padding: 12px 16px;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.tb-title { flex: 1; min-width: 0; text-align: center; font: 800 1.05rem/1 var(--display); font-stretch: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .25s; }
.topbar.scrolled .tb-title { opacity: 1; }
@media (max-width: 520px) { .tb-title { visibility: hidden; } }
.pill { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 7px 15px; font-size: .9rem; font-weight: 600; cursor: pointer; }
.pill:hover, .pill[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.pill svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

.hero { display: grid; gap: 22px; background: var(--bg); color: var(--fg); border-radius: 34px; padding: 14px; margin-top: 6px; animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; }
@media (min-width: 820px) { .hero { grid-template-columns: minmax(0, .92fr) minmax(0, 1.08fr); gap: 34px; padding: 18px; } }
.h-photo { position: relative; min-width: 0; }
.h-photo img { display: block; width: 100%; max-width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 24px; }
@media (min-width: 820px) { .h-photo img { aspect-ratio: 4 / 5; } }
.h-photo .burst-wrap { position: absolute; right: -6px; top: -14px; --size: clamp(86px, 18vw, 120px); animation: pop .6s .3s cubic-bezier(.3, 1.6, .5, 1) both; }
.h-photo .stk-row { position: absolute; left: 14px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
.h-photo .stk-row .stk { animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
.h-photo .stk-row .stk:nth-child(1) { animation-delay: .45s; }
.h-photo .stk-row .stk:nth-child(2) { animation-delay: .55s; --rot: 5deg; }
.h-text { display: flex; flex-direction: column; gap: 16px; padding: 4px 8px 8px; min-width: 0; }
@media (min-width: 820px) { .h-text { padding: 26px 18px 10px 0; } }
.h-text h1 { font-size: clamp(2.2rem, 8vw, 4.2rem); line-height: .88; letter-spacing: -0.035em; }
.h-tag { font-family: var(--serif); font-style: italic; font-size: clamp(1.1rem, 3vw, 1.45rem); line-height: 1.25; max-width: 30ch; }
.h-specs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: auto 0 0; padding: 0; border-top: 2px solid var(--rule); }
.h-specs div { padding: 10px 12px 9px 0; min-width: 0; }
.h-specs div:nth-child(even) { padding-left: 14px; border-left: 2px solid var(--rule); }
.h-specs div:nth-child(n+3) { border-top: 2px solid var(--rule); }
.h-specs dt { font: 700 .68rem/1.2 var(--display); letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
.h-specs dd { margin: 5px 0 0; font: 800 clamp(1.05rem, 3.2vw, 1.3rem)/1.1 var(--display); font-stretch: 85%; font-variant-numeric: tabular-nums; }

.block { margin-top: 34px; }
.b-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; padding-bottom: 16px; border-bottom: 2px solid var(--ink); margin-bottom: 8px; }
.b-head .eyebrow { color: var(--deep); margin-bottom: 8px; }
.b-head h2 { font-size: clamp(2rem, 7vw, 3rem); line-height: .9; }
.prog { display: grid; gap: 8px; min-width: 200px; flex: 0 1 260px; }
.prog-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: .9rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { display: block; height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; border: 1.5px solid var(--ink); }
.bar i { display: block; height: 100%; width: 0; background: var(--deep); transition: width .45s cubic-bezier(.2, .8, .2, 1); }
.linkbtn { background: none; border: 0; padding: 0; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

/* ingredients */
.ilist { list-style: none; margin: 0; padding: 0; }
@media (min-width: 760px) { .ilist { columns: 2; column-gap: 44px; } }
.ilist li { break-inside: avoid; }
.irow { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1.5px solid var(--line); cursor: pointer; border-radius: 10px; transition: background .2s; }
.irow:hover { background: color-mix(in srgb, var(--soft) 60%, transparent); }
.irow input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.cb { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; transition: background .2s, transform .2s; }
.cb svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .3s .05s ease; }
.irow input:checked ~ .cb { background: var(--deep); border-color: var(--deep); animation: boing .35s ease; }
.irow input:checked ~ .cb svg { stroke-dashoffset: 0; }
.irow input:focus-visible ~ .cb { outline: 3px solid var(--ink); outline-offset: 3px; }
.iname { min-width: 0; font-weight: 500; font-size: .95rem; line-height: 1.35; }
.iname small { display: block; margin-top: 2px; font-size: .84rem; color: var(--muted); font-weight: 400; }
.iqty { text-align: right; font: 800 .98rem/1.2 var(--display); font-stretch: 88%; font-variant-numeric: tabular-nums; max-width: 10rem; }
.irow input:checked ~ .iname, .irow input:checked ~ .iqty { opacity: .45; text-decoration: line-through; }

/* steps */
.steps { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 16px; }
.step { position: relative; display: grid; gap: 10px; background: #fff; border: 2px solid var(--ink); border-radius: 24px; padding: 10px; box-shadow: 6px 6px 0 var(--soft); transition: box-shadow .3s, transform .3s; }
@media (min-width: 760px) { .step { grid-template-columns: 240px minmax(0, 1fr); gap: 24px; padding: 12px; } }
.s-art { position: relative; background: var(--soft); border-radius: 18px; height: 112px; max-width: 100%; }
@media (min-width: 760px) { .s-art { height: auto; aspect-ratio: 4 / 3; } }
.s-art .art { position: absolute; left: 4%; top: 5%; width: 92%; height: 90%; overflow: visible; }
.s-art .tip { position: absolute; top: -10px; right: -6px; font-size: .68rem; padding: 6px 11px 5px; --rot: 5deg; z-index: 2; }
.stamp { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; transform: scale(.5) rotate(-14deg); transition: opacity .2s, transform .35s cubic-bezier(.3, 1.6, .5, 1); }
.stamp span { font: 800 1.2rem/1 var(--display); font-stretch: 80%; letter-spacing: .06em; text-transform: uppercase; color: var(--deep); background: #fff; border: 3px solid var(--deep); border-radius: 12px; padding: 8px 14px 6px; }
.s-body { display: flex; flex-direction: column; gap: 8px; padding: 4px 6px 4px; min-width: 0; }
@media (min-width: 760px) { .s-body { padding: 10px 12px 6px 0; } }
.s-num { color: var(--deep); }
.s-body h3 { font-size: clamp(1.35rem, 4.6vw, 1.8rem); line-height: 1; }
.uses { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 5px; }
.uses li { background: var(--soft); border-radius: 9px; padding: 4px 9px; font-size: .84rem; line-height: 1.3; }
.uses b { font-weight: 700; color: var(--deep); margin-right: 3px; }
.uses-label { font: 700 .68rem/1 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.s-text { font-size: .95rem; line-height: 1.5; max-width: 60ch; }
.s-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 2px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 7px 14px; font-size: .86rem; font-weight: 700; border: 2px solid var(--ink); background: #fff; cursor: pointer; transition: transform .15s; }
.btn:active { transform: scale(.96); }
.btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.btn-dark { background: var(--ink); color: #fff; }
.step.done { box-shadow: 0 0 0 var(--soft); transform: translate(3px, 3px); }
.step.done .stamp { opacity: 1; transform: scale(1) rotate(-8deg); }
.step.done .s-art .art { opacity: .3; }
.step.done h3, .step.done .s-text, .step.done .uses { opacity: .45; }
.step.done .btn-done { background: var(--deep); border-color: var(--deep); color: #fff; }

/* finale */
.finale { margin-top: 26px; display: grid; justify-items: center; gap: 12px; text-align: center; padding: 30px 16px; background: var(--bg); color: var(--fg); border-radius: 30px; }
.finale h2 { font-size: clamp(1.6rem, 6vw, 2.4rem); }

/* timer */
.timer {
  position: fixed; left: 50%; bottom: 0; z-index: 50; transform: translateX(-50%);
  width: min(560px, calc(100% - 24px)); margin-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 12px;
  background: var(--ink); color: #fff; border-radius: 999px; padding: 8px 8px 8px 10px;
  box-shadow: 0 20px 40px -18px rgba(0, 0, 0, .6);
  animation: slideup .4s cubic-bezier(.2, .8, .2, 1);
}
.timer[hidden] { display: none; }
.ring { width: 46px; height: 46px; flex-shrink: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 5; }
.ring .bg { stroke: rgba(255, 255, 255, .18); }
.ring .fg { stroke: var(--butter); stroke-linecap: round; stroke-dasharray: 119.4; transition: stroke-dashoffset .5s linear; }
.t-info { flex: 1; min-width: 0; display: grid; }
.t-time { font: 800 1.6rem/1 var(--display); font-stretch: 85%; font-variant-numeric: tabular-nums; }
.t-label { font-size: .8rem; opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-btn { background: #fff; color: var(--ink); border: 0; border-radius: 999px; padding: 9px 14px; font-weight: 700; font-size: .88rem; cursor: pointer; flex-shrink: 0; }
.t-btn.ghost { background: transparent; color: #fff; border: 1.5px solid rgba(255, 255, 255, .4); }
.timer.finished { background: var(--tomato); animation: shakeit .5s ease 3; }

/* celebration */
.party { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(30, 22, 18, .45); padding: 16px; }
.party[hidden] { display: none; }
.party canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.party-card { position: relative; display: grid; justify-items: center; gap: 14px; text-align: center; background: var(--paper); border: 3px solid var(--ink); border-radius: 30px; padding: 26px 22px 22px; max-width: 380px; width: 100%; animation: pop .5s cubic-bezier(.3, 1.6, .5, 1) both; }
.party-card .burst { --size: 150px; }
.party-card p { font-size: 1.05rem; }

/* ---------- Illustration motion ("GIFs") ---------- */
.art { display: block; }
.a-steam { transform-box: fill-box; transform-origin: 50% 100%; animation: steam 2.6s ease-in-out infinite; }
.a-flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flame .42s ease-in-out infinite alternate; }
.a-knife { transform-box: view-box; transform-origin: 120px 42px; animation: knife 1.1s ease-in-out infinite; }
.a-drop { animation: drop 1.7s ease-in infinite; }
.a-fall { animation: fall 1.5s ease-in infinite; }
.a-spoon { transform-box: view-box; transform-origin: 141px 13px; animation: swing 1.3s ease-in-out infinite alternate; }
.a-stir { transform-box: view-box; transform-origin: 150px 11px; animation: swing 1s ease-in-out infinite alternate; }
.a-dash { stroke-dasharray: 6 8; animation: dash 1s linear infinite; }
.a-clock { transform-box: view-box; transform-origin: 160px 34px; animation: spin 2.4s linear infinite; }
.a-glow { animation: glow 1.1s ease-in-out infinite alternate; }
.a-sizzle { animation: sizzle .3s ease-in-out infinite alternate; }
.a-flip { transform-box: fill-box; transform-origin: 50% 50%; animation: flip 2.2s cubic-bezier(.5, 0, .5, 1) infinite; }
.a-twinkle { transform-box: fill-box; transform-origin: 50% 50%; animation: twinkle 1.8s ease-in-out infinite; }
.a-bob { animation: bob .8s ease-in-out infinite alternate; }
.a-bubble { transform-box: fill-box; transform-origin: 50% 50%; animation: bubble 1.3s ease-out infinite; }
.a-shake { animation: jitter .12s linear infinite alternate; }
.a-orbit { transform-box: view-box; transform-origin: 100px 84px; animation: spin .9s linear infinite; }
.a-blade { transform-box: fill-box; transform-origin: 50% 50%; animation: blade .12s linear infinite alternate; }
.a-blink { animation: blink .7s steps(2) infinite; }

/* ===================== Stickers ===================== */
function burst(lines, fill, fg, spin) {
  var pts = [], n = 14;
  for (var i = 0; i < n * 2; i++) {
    var a = Math.PI * i / n - Math.PI / 2, r = i % 2 ? 44 : 54;
    pts.push((60 + r * Math.cos(a)).toFixed(1) + ',' + (60 + r * Math.sin(a)).toFixed(1));
  }
  var size = lines.length > 1 ? 17 : 24, start = 60 - (lines.length - 1) * size * 0.55 + size * 0.36;
  var t = lines.map(function (l, i) { return '<tspan x="60" y="' + (start + i * size * 1.05).toFixed(1) + '">' + l + '</tspan>'; }).join('');
  return '<svg class="burst" viewBox="0 0 120 120" aria-hidden="true"><g class="' + (spin ? 'burst-spin' : '') + '" style="transform-origin:60px 60px"><polygon points="' + pts.join(' ') + '" fill="' + fill + '" stroke="#fff" stroke-width="6" stroke-linejoin="round"/></g><text text-anchor="middle" font-size="' + size + '" fill="' + fg + '">' + t + '</text></svg>';
}

function updateProgress(celebrate) {
  var root = app.querySelector('[data-recipe]');
  if (!root) return;
  var ib = root.querySelectorAll('.irow input'), id = 0;
  ib.forEach(function (b) { if (b.checked) id++; });
  var st = root.querySelectorAll('.step'), sd = 0;
  st.forEach(function (s) { if (s.classList.contains('done')) sd++; });
  document.getElementById('ing-count').textContent = id + ' of ' + ib.length + ' ready';
  document.getElementById('ing-bar').style.width = (ib.length ? id / ib.length * 100 : 0) + '%';
  document.getElementById('step-count').textContent = sd + ' of ' + st.length + ' done';
  document.getElementById('step-bar').style.width = (st.length ? sd / st.length * 100 : 0) + '%';
  if (celebrate && sd === st.length && st.length) party(root.getAttribute('data-recipe'));
}

/* ===================== Routing ===================== */
function render() {
  var r = RECIPES.filter(function (x) { return x.id === current; })[0];
  if (r) recipeView(r); else { current = ''; homeView(); }
  window.scrollTo(0, 0);
}
function go(id) {
  current = id;
  try { if (id) history.pushState(null, '', '#' + id); else history.pushState(null, '', location.pathname + location.search); } catch (e) {}
  render();
}
window.addEventListener('popstate', function () { try { current = (location.hash || '').slice(1); } catch (e) { current = ''; } render(); });

/* ===================== Keep screen on ===================== */
var lock = null;
function setWake(on) {
  var btn = document.getElementById('wake');
  if (!on) { if (lock) { lock.release().catch(function () {}); lock = null; } if (btn) btn.setAttribute('aria-pressed', 'false'); return; }
  if (!('wakeLock' in navigator)) { if (btn) btn.lastChild.textContent = 'Not available here'; return; }
  navigator.wakeLock.request('screen').then(function (l) {
    lock = l; if (btn) btn.setAttribute('aria-pressed', 'true');
    l.addEventListener('release', function () { var b = document.getElementById('wake'); if (b) b.setAttribute('aria-pressed', 'false'); lock = null; });
  }).catch(function () { if (btn) btn.lastChild.textContent = 'Not available here'; });
}

/* ===================== Timer ===================== */
var T = { total: 0, left: 0, end: 0, id: null, paused: false, ctx: null };
var tEl = document.getElementById('timer'), tTime = document.getElementById('t-time'), tLabel = document.getElementById('t-label'),
    tPause = document.getElementById('t-pause'), tStop = document.getElementById('t-stop'), ring = document.getElementById('ring-fg');
function beep() {
  if (!T.ctx) return;
  try {
    [0, .3, .6, 1.2, 1.5, 1.8].forEach(function (d) {
      var o = T.ctx.createOscillator(), g = T.ctx.createGain(), t0 = T.ctx.currentTime + d;
      o.frequency.value = 880; o.connect(g); g.connect(T.ctx.destination);
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.3, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .22);
      o.start(t0); o.stop(t0 + .25);
    });
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {}
}
function paint() {
  tTime.textContent = fmt(T.left);
  ring.style.strokeDashoffset = (119.4 * (1 - T.left / T.total)).toFixed(1);
}
function tick() {
  T.left = Math.max(0, Math.round((T.end - Date.now()) / 1000));
  paint();
  if (T.left === 0) {
    clearInterval(T.id); T.id = null;
    tEl.classList.add('finished'); tLabel.textContent = 'Time is up: ' + tLabel.dataset.base;
    tPause.hidden = true; tStop.textContent = 'Close'; beep();
  }
}
function startTimer(sec, label) {
  try { T.ctx = T.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (T.ctx.state === 'suspended') T.ctx.resume(); } catch (e) {}
  clearInterval(T.id);
  T.total = sec; T.left = sec; T.end = Date.now() + sec * 1000; T.paused = false;
  tLabel.textContent = label; tLabel.dataset.base = label;
  tPause.hidden = false; tPause.textContent = 'Pause'; tStop.textContent = 'Stop';
  tEl.classList.remove('finished'); tEl.hidden = false;
  paint(); T.id = setInterval(tick, 500);
}
tPause.addEventListener('click', function () {
  if (T.paused) { T.end = Date.now() + T.left * 1000; T.id = setInterval(tick, 500); T.paused = false; tPause.textContent = 'Pause'; }
  else { clearInterval(T.id); T.id = null; T.paused = true; tPause.textContent = 'Resume'; }
});
tStop.addEventListener('click', function () { clearInterval(T.id); T.id = null; tEl.hidden = true; });

/* ===================== Celebration ===================== */
var partyEl = document.getElementById('party'), canvas = document.getElementById('confetti');
function party(id) {
  var r = RECIPES.filter(function (x) { return x.id === id; })[0];
  document.getElementById('party-card').innerHTML = burst(['Ready', 'to serve!'], r.theme.burst, r.theme.burstFg, true) +
    '<h2 style="font-size:2rem">' + r.name + '</h2><p>All ' + r.steps.length + ' steps done. Serve it hot.</p><button class="btn btn-dark" id="party-close">Close</button>';
  partyEl.hidden = false;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var ctx = canvas.getContext('2d'), w = canvas.width = innerWidth, h = canvas.height = innerHeight;
  var cols = ['#D63B27', '#FFD35A', '#1F5A43', '#FFB21E', '#FFF4DF', '#F7BCA8'];
  var bits = []; for (var i = 0; i < 160; i++) bits.push({ x: w / 2 + (Math.random() - .5) * 120, y: h * .45, vx: (Math.random() - .5) * 14, vy: -Math.random() * 16 - 4, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, s: 6 + Math.random() * 8, c: cols[i % cols.length] });
  var t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, w, h);
    bits.forEach(function (b) { b.vy += .45; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.r += b.vr; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c; ctx.fillRect(-b.s / 2, -b.s / 4, b.s, b.s / 2); ctx.restore(); });
    if (t - t0 < 3200 && !partyEl.hidden) requestAnimationFrame(frame); else ctx.clearRect(0, 0, w, h);
  })(t0);
}
partyEl.addEventListener('click', function (e) { if (e.target.id === 'party-close' || e.target === partyEl) partyEl.hidden = true; });

/* ===================== Events ===================== */
app.addEventListener('click', function (e) {
  var t = e.target;
  var open = t.closest('[data-open]'); if (open) { e.preventDefault(); go(open.getAttribute('data-open')); return; }
  if (t.closest('[data-back]')) { setWake(false); go(''); return; }
  if (t.closest('#wake')) { setWake(!lock); return; }
  var f = t.closest('[data-filter]'); if (f) { filter = f.getAttribute('data-filter'); app.querySelectorAll('[data-filter]').forEach(function (b) { b.setAttribute('aria-pressed', b === f ? 'true' : 'false'); }); document.getElementById('cards').innerHTML = cardsHTML(); return; }
  var tb = t.closest('[data-timer]'); if (tb) { startTimer(+tb.getAttribute('data-timer'), tb.getAttribute('data-label')); return; }
  var sb = t.closest('[data-step]');
  if (sb) {
    var k = sb.getAttribute('data-step'), li = sb.closest('.step'), on = !li.classList.contains('done');
    li.classList.toggle('done', on); sb.setAttribute('aria-pressed', on ? 'true' : 'false'); sb.querySelector('span').textContent = on ? 'Done' : 'Mark as done';
    if (on) state[k] = 1; else delete state[k];
    save(); updateProgress(on); return;
  }
  var rs = t.closest('[data-reset]');
  if (rs) {
    var root = app.querySelector('[data-recipe]'), id = root.getAttribute('data-recipe'), kind = rs.getAttribute('data-reset');
    Object.keys(state).forEach(function (key) { if (key.indexOf(id + ':' + kind) === 0) delete state[key]; });
    save();
    if (kind === 'i') root.querySelectorAll('.irow input').forEach(function (i) { i.checked = false; });
    else root.querySelectorAll('.step').forEach(function (s) { s.classList.remove('done'); var b = s.querySelector('[data-step]'); b.setAttribute('aria-pressed', 'false'); b.querySelector('span').textContent = 'Mark as done'; });
    updateProgress(false);
  }
});
app.addEventListener('change', function (e) {
  var i = e.target; if (!i.matches || !i.matches('input[data-key]')) return;
  var k = i.getAttribute('data-key');
  if (i.checked) state[k] = 1; else delete state[k];
  save(); updateProgress(false);
});
app.addEventListener('input', function (e) {
  if (e.target.id !== 'search') return;
  query = e.target.value;
  document.getElementById('cards').innerHTML = cardsHTML();
});

try { current = (location.hash || '').slice(1); } catch (e) { current = ''; }
render();
</script>
