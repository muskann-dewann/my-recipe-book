<style>
/* Layout: iOS-style app. Home = large title, search, segmented filter, photo cards. Recipe = translucent nav bar, full-bleed photo, facts card, sticky segmented jump, grouped ingredient list with weight stepper, step cards with timers. */
:root {
  --bg: #F2F2F7;
  --card: #FFFFFF;
  --fill: #F0F0F5;
  --fill2: #E5E5EA;
  --text: #1C1C1E;
  --text2: #6E6E73;
  --text3: #8E8E93;
  --sep: rgba(60, 60, 67, .14);
  --accent: #F26B1D;
  --accent-text: #C2410C;
  --tint: rgba(242, 107, 29, .12);
  --green: #34C759;
  --nonveg: #B3261E;
  --veg: #1E8E3E;
  --star: #FF9F0A;
  --navbg: rgba(242, 242, 247, .8);
  --scrim: rgba(0, 0, 0, .35);
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 10px 28px -14px rgba(0, 0, 0, .18);
  --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --card: #1C1C1E; --fill: #2C2C2E; --fill2: #3A3A3C;
    --text: #F5F5F7; --text2: #AEAEB2; --text3: #8E8E93; --sep: rgba(84, 84, 88, .55);
    --accent: #FF8A3D; --accent-text: #FF9F5A; --tint: rgba(255, 138, 61, .16);
    --green: #30D158; --nonveg: #FF6B5E; --veg: #4CD964; --star: #FFB340;
    --navbg: rgba(0, 0, 0, .72); --scrim: rgba(0, 0, 0, .6); --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 16px/1.5 var(--font); letter-spacing: -0.01em;
  padding: env(safe-area-inset-top, 0px) 16px calc(120px + env(safe-area-inset-bottom, 0px));
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
p { margin: 0; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.view { max-width: 1080px; margin-inline: auto; animation: enter .35s cubic-bezier(.2, .8, .2, 1); }
.view.recipe { max-width: 760px; }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- shared controls ---------- */
.icon-btn { position: relative; display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--fill); color: var(--text); transition: transform .15s, background .2s; }
.icon-btn:active { transform: scale(.92); }
.icon-btn[aria-pressed="true"] { background: var(--accent); color: #fff; }
.badge { position: absolute; top: -3px; right: -3px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--accent); color: #fff; font-size: .68rem; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--bg); }
.badge[data-n="0"] { display: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: 12px; padding: 11px 16px; font-size: .94rem; font-weight: 600; transition: transform .15s, background .2s, color .2s; text-decoration: none; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-tinted { background: var(--tint); color: var(--accent-text); }
.btn-tinted[aria-pressed="true"] { background: var(--accent); color: #fff; }
.btn-plain { background: var(--fill); color: var(--text); }
.btn svg.i { width: 18px; height: 18px; }
.text-btn { border: 0; background: none; padding: 6px 0; color: var(--accent-text); font-size: .9rem; font-weight: 600; }
.segmented { display: flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--fill2); }
.segmented button { flex: 1; border: 0; background: transparent; border-radius: 8px; padding: 7px 12px; font-size: .88rem; font-weight: 600; color: var(--text); white-space: nowrap; transition: background .2s, box-shadow .2s; }
.segmented button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04); }
.stars { display: inline-flex; gap: 1px; color: var(--star); font-size: .9rem; letter-spacing: 0; }
.stars .off { color: var(--fill2); }
.vtag { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; font-weight: 600; color: var(--nonveg); }
.vtag.veg { color: var(--veg); }
.vtag i { width: 13px; height: 13px; border: 1.5px solid currentColor; border-radius: 3px; display: grid; place-items: center; }
.vtag i::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.dot-sep { color: var(--text3); }

/* ---------- home ---------- */
.home-top { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; min-height: 52px; }
.home-top .kicker { font-size: .82rem; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .04em; }
.large-title { font-size: 2.15rem; font-weight: 700; letter-spacing: -0.025em; line-height: 1.1; margin-top: 2px; }
.subtitle { color: var(--text2); margin-top: 6px; font-size: .98rem; max-width: 46ch; }
.search { position: relative; display: block; margin-top: 18px; }
.search input { width: 100%; border: 0; background: var(--fill2); border-radius: 12px; padding: 10px 14px 10px 38px; font-size: 1rem; color: var(--text); outline: none; }
.search input::placeholder { color: var(--text3); }
.search svg.i { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text3); }
.home-filters { margin-top: 12px; max-width: 420px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; margin-top: 20px; }
.card { display: flex; flex-direction: column; background: var(--card); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); cursor: pointer; transition: transform .25s cubic-bezier(.2, .8, .2, 1); animation: enter .45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i, 0) * 60ms); }
.card:active { transform: scale(.98); }
@media (hover: hover) { .card:hover { transform: translateY(-3px); } .card:hover .card-photo img { transform: scale(1.03); } }
.card-photo { overflow: hidden; aspect-ratio: 4 / 3; background: var(--fill); }
.card-photo img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.card-body { flex: 1; padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .78rem; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .04em; }
.card h2 { font-size: 1.28rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.card-tag { color: var(--text2); font-size: .9rem; }
.card-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--text2); font-size: .86rem; margin: 4px 0 10px; }
.card-meta span { display: inline-flex; align-items: center; gap: 5px; }
.card-meta svg.i { width: 16px; height: 16px; color: var(--text3); }
.card-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: auto; padding-top: 10px; border-top: .5px solid var(--sep); }
.card-foot .when { display: flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--text3); flex-wrap: wrap; }
.add-btn { display: inline-flex; align-items: center; gap: 5px; border: 0; border-radius: 999px; padding: 6px 12px; background: var(--tint); color: var(--accent-text); font-size: .8rem; font-weight: 600; white-space: nowrap; transition: background .2s, color .2s, transform .15s; }
.add-btn:active { transform: scale(.94); }
.add-btn svg.i { width: 15px; height: 15px; stroke-width: 2.2; }
.add-btn[aria-pressed="true"] { background: var(--accent); color: #fff; }
.empty { color: var(--text2); padding: 30px 0; text-align: center; }

/* ---------- recipe ---------- */
.navbar {
  position: sticky; top: 0; z-index: 30; margin-inline: -16px; padding: 8px 12px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  background: var(--navbg); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid transparent; transition: border-color .2s;
}
.navbar.scrolled { border-bottom-color: var(--sep); }
.nav-back { justify-self: start; display: inline-flex; align-items: center; gap: 2px; border: 0; background: none; color: var(--accent-text); font-size: 1.02rem; font-weight: 500; padding: 6px 4px; }
.nav-back svg.i { width: 22px; height: 22px; stroke-width: 2.2; }
.nav-title { font-weight: 600; font-size: .98rem; max-width: 46vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .2s; }
.navbar.scrolled .nav-title { opacity: 1; }
.nav-actions { justify-self: end; display: flex; gap: 8px; }
.nav-actions .icon-btn { width: 34px; height: 34px; }
.nav-actions svg.i { width: 18px; height: 18px; }
.r-hero { margin: 4px -16px 0; aspect-ratio: 4 / 3; overflow: hidden; background: var(--fill); }
.r-hero img { width: 100%; height: 100%; object-fit: cover; }
@media (min-width: 640px) { .r-hero { margin: 8px 0 0; border-radius: 22px; aspect-ratio: 16 / 10; } }
.r-head { padding: 18px 2px 4px; display: grid; gap: 6px; }
.r-course { font-size: .8rem; font-weight: 600; color: var(--accent-text); text-transform: uppercase; letter-spacing: .05em; }
.r-head h1 { font-size: clamp(1.75rem, 6.5vw, 2.3rem); font-weight: 700; letter-spacing: -0.025em; line-height: 1.12; }
.r-tag { color: var(--text2); font-size: 1rem; }
.r-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-top: 4px; font-size: .86rem; color: var(--text2); }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--card); border-radius: 18px; margin-top: 14px; box-shadow: var(--shadow); }
.fact { padding: 12px 6px; text-align: center; display: grid; justify-items: center; gap: 2px; min-width: 0; }
.fact + .fact { border-left: .5px solid var(--sep); }
.fact svg.i { color: var(--accent); width: 20px; height: 20px; margin-bottom: 2px; }
.fact span { font-size: .7rem; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }
.fact b { font-size: .92rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.r-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.jumpbar { position: sticky; top: 52px; z-index: 20; margin: 16px -16px 0; padding: 8px 16px; background: var(--navbg); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); }
.sec { scroll-margin-top: 110px; padding-top: 18px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 0 2px 10px; }
.sec-head h2 { font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; }
.sec-head .count { font-size: .86rem; color: var(--text2); font-variant-numeric: tabular-nums; }
.group { background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.group + .group { margin-top: 12px; }
.stepper-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px 12px 16px; }
.stepper-row .lbl { display: grid; }
.stepper-row .lbl b { font-weight: 600; font-size: .98rem; }
.stepper-row .lbl small { color: var(--text3); font-size: .78rem; }
.stepper { display: inline-flex; align-items: center; background: var(--fill); border-radius: 10px; }
.stepper button { width: 40px; height: 34px; border: 0; background: none; font-size: 1.25rem; line-height: 1; color: var(--text); }
.stepper button:disabled { color: var(--text3); opacity: .5; cursor: default; }
.stepper output { min-width: 62px; text-align: center; font-weight: 600; font-size: .95rem; font-variant-numeric: tabular-nums; border-inline: .5px solid var(--sep); padding: 0 6px; }
.scale-note { padding: 0 16px 12px; font-size: .8rem; color: var(--accent-text); }
.ilist { list-style: none; margin: 0; padding: 0; }
.irow { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; cursor: pointer; }
.ilist li + li .irow::before { content: ""; position: absolute; top: 0; left: 52px; right: 0; border-top: .5px solid var(--sep); }
.irow input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.cb { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--text3); display: grid; place-items: center; transition: background .2s, border-color .2s, transform .25s cubic-bezier(.3, 1.6, .5, 1); }
.cb svg { width: 13px; height: 13px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .25s .05s; }
.irow input:checked ~ .cb { background: var(--accent); border-color: var(--accent); transform: scale(1.06); }
.irow input:checked ~ .cb svg { stroke-dashoffset: 0; }
.irow input:focus-visible ~ .cb { outline: 2px solid var(--accent); outline-offset: 2px; }
.iname { min-width: 0; font-size: .97rem; }
.iname small { display: block; color: var(--text3); font-size: .78rem; margin-top: 1px; }
.iqty { font-weight: 600; font-size: .95rem; text-align: right; color: var(--text); font-variant-numeric: tabular-nums; max-width: 11rem; }
.irow input:checked ~ .iname, .irow input:checked ~ .iqty { color: var(--text3); text-decoration: line-through; }
.sec-foot { display: flex; justify-content: flex-end; padding: 4px 2px 0; }
.progress { height: 4px; border-radius: 99px; background: var(--fill2); overflow: hidden; margin: 0 2px 12px; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .4s cubic-bezier(.2, .8, .2, 1); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.step { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 14px 14px 16px; display: grid; gap: 10px; transition: opacity .3s; }
.step-head { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: start; }
.step-num { width: 30px; height: 30px; border-radius: 50%; background: var(--tint); color: var(--accent-text); display: grid; place-items: center; font-weight: 700; font-size: .9rem; font-variant-numeric: tabular-nums; transition: background .25s, color .25s; }
.step-of { font-size: .72rem; color: var(--text3); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.step h3 { font-size: 1.06rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
.check { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--text3); background: none; display: grid; place-items: center; transition: background .2s, border-color .2s, transform .3s cubic-bezier(.3, 1.6, .5, 1); }
.check svg { width: 15px; height: 15px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity .2s; }
.step.done .check { background: var(--green); border-color: var(--green); transform: scale(1.06); }
.step.done .check svg { opacity: 1; }
.step.done .step-num { background: var(--fill); color: var(--text3); }
.step.done .step-body { opacity: .45; }
.step-body { display: grid; gap: 10px; padding-left: 42px; transition: opacity .3s; }
.uses { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
.uses li { background: var(--fill); border-radius: 8px; padding: 4px 9px; font-size: .84rem; line-height: 1.35; color: var(--text); }
.uses b { font-weight: 600; color: var(--accent-text); margin-right: 2px; }
.step-text { font-size: .97rem; line-height: 1.55; color: var(--text); }
.timer-btn { justify-self: start; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 999px; background: var(--tint); color: var(--accent-text); padding: 7px 13px; font-size: .86rem; font-weight: 600; transition: transform .15s; }
.timer-btn:active { transform: scale(.95); }
.timer-btn svg.i { width: 16px; height: 16px; stroke-width: 2; }
.notes { margin-top: 16px; background: var(--card); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
.notes h3 { font-size: .8rem; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 6px; }
.notes h3 svg.i { width: 16px; height: 16px; }
.notes p, .notes li { font-size: .92rem; color: var(--text2); margin-top: 6px; }
.notes ul { margin: 0; padding-left: 18px; }

/* ---------- timer ---------- */
.timer {
  position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 50;
  width: min(440px, calc(100% - 24px)); display: flex; align-items: center; gap: 12px;
  background: #1C1C1E; color: #fff; border-radius: 999px; padding: 7px 7px 7px 9px;
  box-shadow: 0 16px 40px -14px rgba(0, 0, 0, .55); animation: tin .35s cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) { .timer { background: #2C2C2E; } }
@keyframes tin { from { transform: translate(-50%, 140%); } to { transform: translate(-50%, 0); } }
.ring { width: 40px; height: 40px; flex-shrink: 0; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 4; }
.ring .bg { stroke: rgba(255, 255, 255, .16); }
.ring .fg { stroke: #FF8A3D; stroke-linecap: round; stroke-dasharray: 107; transition: stroke-dashoffset .5s linear; }
.t-info { flex: 1; min-width: 0; display: grid; line-height: 1.2; }
.t-time { font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.t-label { font-size: .76rem; color: rgba(255, 255, 255, .6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-btn { width: 38px; height: 38px; border-radius: 50%; border: 0; display: grid; place-items: center; background: rgba(255, 255, 255, .14); color: #fff; flex-shrink: 0; }
.t-btn.stop { background: #FF453A; }
.t-btn svg.i { width: 17px; height: 17px; stroke-width: 2.2; }
.timer.finished { background: var(--accent); animation: nudge .5s ease 3; }
.timer.finished .t-label { color: rgba(255, 255, 255, .9); }
@keyframes nudge { 0%, 100% { transform: translateX(-50%); } 30% { transform: translateX(calc(-50% - 5px)); } 70% { transform: translateX(calc(-50% + 5px)); } }

/* ---------- sheets ---------- */
.sheet { position: fixed; inset: 0; z-index: 60; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fade .25s; }
@keyframes fade { from { opacity: 0; } }
.sheet-panel { width: min(600px, 100%); max-height: 90vh; overflow: auto; background: var(--bg); border-radius: 18px 18px 0 0; padding: 8px 16px calc(16px + env(safe-area-inset-bottom, 0px)); animation: up .35s cubic-bezier(.2, .8, .2, 1); }
@media (min-width: 700px) { .sheet { align-items: center; padding: 20px; } .sheet-panel { border-radius: 18px; } }
@keyframes up { from { transform: translateY(60px); opacity: .6; } to { transform: none; opacity: 1; } }
.grabber { width: 38px; height: 5px; border-radius: 99px; background: var(--fill2); margin: 0 auto 10px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.sheet-head h2 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
.sl-recipes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.sl-rec { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border-radius: 999px; padding: 5px 5px 5px 12px; font-size: .82rem; font-weight: 500; box-shadow: var(--shadow); }
.sl-rec button { width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--fill); color: var(--text2); display: grid; place-items: center; }
.sl-rec svg.i { width: 12px; height: 12px; stroke-width: 2.6; }
.sl-hint { font-size: .8rem; color: var(--text3); margin: 0 2px 10px; }
.sl-empty { color: var(--text2); text-align: center; padding: 26px 10px; }
.sl-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.sl-actions .full { grid-column: 1 / -1; }
.done-card { width: min(340px, calc(100% - 32px)); margin: auto; background: var(--card); border-radius: 22px; padding: 26px 20px 18px; text-align: center; display: grid; justify-items: center; gap: 8px; animation: pop .45s cubic-bezier(.3, 1.4, .5, 1); align-self: center; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.done-card svg.big { width: 72px; height: 72px; }
.done-card svg.big circle { fill: var(--green); }
.done-card svg.big path { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .45s .25s forwards; }

.done-card p { color: var(--text2); font-size: .92rem; }
.done-card .btn { width: 100%; margin-top: 10px; }
.toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 80; display: inline-flex; align-items: center; gap: 8px; background: var(--card); color: var(--text); border-radius: 999px; padding: 10px 16px; font-size: .88rem; font-weight: 600; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .35); animation: drop .3s cubic-bezier(.2, .8, .2, 1); }

@keyframes drop { from { transform: translate(-50%, -20px); opacity: 0; } }

/* ===================== State ===================== */
var KEY = 'my-recipe-book-v4';

function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
var app = document.getElementById('app');
var query = '', filter = 'All', current = '';
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function byId(id) { return RECIPES.filter(function (x) { return x.id === id; })[0]; }
function fmt(sec) { var m = Math.floor(sec / 60), s = sec % 60; return m + ':' + (s < 10 ? '0' : '') + s; }
function mins(sec) { return sec >= 60 ? Math.round(sec / 60) + ' min' : sec + ' sec'; }

/* ===================== Quantities ===================== */
var FRAC = { '¼': .25, '½': .5, '¾': .75, '⅓': 1 / 3, '⅔': 2 / 3 };
var NUM = '(\\d+(?:\\.\\d+)?[¼½¾⅓⅔]?|[¼½¾⅓⅔])';
function toNum(t) { var m = t.match(/^(\d+(?:\.\d+)?)?([¼½¾⅓⅔])?$/); return m ? (m[1] ? parseFloat(m[1]) : 0) + (m[2] ? FRAC[m[2]] : 0) : 0; }
function fromNum(v, step) {
  v = Math.max(step, Math.round(v / step) * step);
  var w = Math.floor(v + 1e-9), f = v - w, map = [[.25, '¼'], [.5, '½'], [.75, '¾']];
  for (var i = 0; i < map.length; i++) if (Math.abs(f - map[i][0]) < .01) return (w || '') + map[i][1];
  if (f < .01) return String(w);

}
function fmtGrams(g) {
  if (g >= 1000) return String(+(Math.round(g / 50) * 50 / 1000).toFixed(2)) + ' kg';
  return (g < 100 ? Math.max(5, Math.round(g / 5) * 5) : Math.round(g / 10) * 10) + ' g';
}
function fmtMl(ml) { return ml >= 1000 ? String(+(ml / 1000).toFixed(2)) + ' litres' : Math.round(ml / 10) * 10 + ' ml'; }
function scaleQty(q, k, name) {
  if (k === 1 || !q) return q;
  var s = q.replace(/^A handful$/i, '1 handful');
  if (!/[\d¼½¾⅓⅔]/.test(s)) return q;
  var w = s.match(new RegExp('^' + NUM + '\\s*(kg|g)$'));
  if (w) return fmtGrams(toNum(w[1]) * (w[2] === 'kg' ? 1000 : 1) * k);
  var v = s.match(new RegExp('^' + NUM + '\\s*ml$'));
  if (v) return fmtMl(toNum(v[1]) * k);
  var ctx = (s + ' ' + (name || '')).toLowerCase();
  var step = /tsp|tbsp|spoon|cup|lemon/.test(ctx) ? .25 : /clove|cardamom|chilli|cinnamon|stick/.test(ctx) ? 1 : .5;
  var out = s.replace(new RegExp(NUM, 'g'), function (t) { return fromNum(toNum(t) * k, step); });
  out = out.replace(/([\d.]*[¼½¾]?)–\1(?![\d¼½¾])/g, '$1');
  return out.replace(/^(.+?) handfuls?$/, function (a, n) { return n === '1' ? 'A handful' : /^[¼½¾]$/.test(n) ? n + ' handful' : n + ' handfuls'; });
}
function weights(r) {
  var list = [250, 500, 750, 1000, 1500, 2000];
  if (list.indexOf(r.base) < 0) list.push(r.base);
  return list.sort(function (a, b) { return a - b; });
}

function stars(n) { var s = ''; for (var i = 1; i <= 5; i++) s += '<span' + (i <= n ? '' : ' class="off"') + '>★</span>'; return '<span class="stars" role="img" aria-label="Rated ' + n + ' out of 5">' + s + '</span>'; }
function vegTag(v) { return '<span class="vtag' + (v ? ' veg' : '') + '"><i></i>' + (v ? 'Veg' : 'Non-veg') + '</span>'; }

/* ===================== Shopping list ===================== */
function inList(id) { return !!(state.list && state.list[id]); }
function listCount() { return Object.keys(state.list || {}).length; }
function badge() { var n = listCount(); return '<span class="badge" data-lc data-n="' + n + '">' + n + '</span>'; }

  return (on ? I.checkI + 'Added' : I.plus + 'List');
}
function refreshListUI() {
  document.querySelectorAll('[data-lc]').forEach(function (el) { var n = listCount(); el.textContent = n; el.setAttribute('data-n', n); });
  document.querySelectorAll('[data-addlist]').forEach(function (b) {
    var id = b.getAttribute('data-addlist');
    b.setAttribute('aria-pressed', inList(id) ? 'true' : 'false');
    b.innerHTML = addBtnHTML(id, b.classList.contains('btn'));
  });
}
function toggleList(id) {
  state.list = state.list || {};
  var r = byId(id);
  if (inList(id)) { delete state.list[id]; toast('Removed from shopping list'); }
  else { state.list[id] = grams(r); toast('Added to shopping list'); }
  save(); refreshListUI();
}
function parseSimple(q) {
  q = q.replace(/^A handful$/i, '1 handful');
  var m = q.match(new RegExp('^' + NUM + '\\s*(tsp|tbsp|g|kg|ml|cup|cups|spoon|lemon|lemons|handful|handfuls)?$'));
  if (!m) return null;
  var v = toNum(m[1]), u = m[2] || '';
  if (u === 'kg') { v *= 1000; u = 'g'; }
  u = u.replace(/s$/, '');
  return { v: v, u: u };
}
function fmtUnit(sum, u) {
  if (u === 'g') return fmtGrams(sum);
  if (u === 'ml') return fmtMl(sum);
  var n = fromNum(sum, .25);
  if (u === 'handful') return n === '1' ? 'A handful' : n + (sum > 1 ? ' handfuls' : ' handful');
  if (u === 'lemon') return n + (sum > 1 ? ' lemons' : ' lemon');
  return n + (u ? ' ' + u : '');
}
function buildList() {
  var map = {}, order = [];
  Object.keys(state.list || {}).forEach(function (id) {
    var r = byId(id); if (!r) return;
    var k = state.list[id] / r.base;
    r.items.forEach(function (it) {
      var key = it[0].toLowerCase();
      if (!map[key]) { map[key] = { name: it[0], parts: [], from: [] }; order.push(key); }
      map[key].parts.push(scaleQty(it[1], k, it[0])); map[key].from.push(r.name);

  });
  return order.map(function (key) {
    var e = map[key], qty;
    if (e.parts.length === 1) qty = e.parts[0];
    else {
      var sums = {}, units = [], other = [];
      e.parts.forEach(function (p) {
        var ps = parseSimple(p);
        if (ps) { if (!(ps.u in sums)) { sums[ps.u] = 0; units.push(ps.u); } sums[ps.u] += ps.v; }
        else if (other.indexOf(p) < 0) other.push(p);
      });
      qty = units.map(function (u) { return fmtUnit(sums[u], u); }).concat(other.map(function (o, i) { return units.length || i ? o.toLowerCase() : o; })).join(' + ');
    }
    return { key: key, name: e.name, qty: qty, from: e.from };
  });
}
function listText(rows) {
  var have = state.have || {};
  var recs = Object.keys(state.list || {}).map(function (id) { var r = byId(id); return r ? r.name + ' (' + fmtGrams(state.list[id]) + ' chicken)' : ''; }).filter(Boolean);
  var lines = rows.filter(function (x) { return !have[x.key]; }).map(function (x) { return '- ' + x.name + ': ' + x.qty; });
  return 'Shopping list (My Recipe Book)\nFor: ' + recs.join(', ') + '\n\n' + lines.join('\n');
}
var sheet = document.getElementById('sheet'), sheetBody = document.getElementById('sheet-body');
function renderSheet() {
  var ids = Object.keys(state.list || {});
  if (!ids.length) { sheetBody.innerHTML = '<p class="sl-empty">Your list is empty.<br>Tap <b>List</b> on a recipe card, or <b>Add to list</b> inside a recipe.</p>'; return; }
  var rows = buildList(), have = state.have || {};
  var recs = ids.map(function (id) { var r = byId(id); return r ? '<span class="sl-rec">' + r.name + ' · ' + fmtGrams(state.list[id]) + '<button data-unlist="' + id + '" aria-label="Remove ' + esc(r.name) + '">' + I.x + '</button></span>' : ''; }).join('');
  var items = rows.map(function (x) {
    return '<li><label class="irow"><input type="checkbox" data-have="' + esc(x.key) + '"' + (have[x.key] ? ' checked' : '') + '><span class="cb">' + I.check + '</span>' +
      '<span class="iname">' + x.name + (ids.length > 1 ? '<small>' + x.from.join(', ') + '</small>' : '') + '</span><span class="iqty">' + x.qty + '</span></label></li>';
  }).join('');
  sheetBody.innerHTML = '<div class="sl-recipes">' + recs + '</div>' +
    '<p class="sl-hint">Tick anything you already have. Ticked items are left out when you send or copy the list.</p>' +
    '<div class="group"><ul class="ilist">' + items + '</ul></div>' +
    '<div class="sl-actions"><a class="btn btn-primary full" id="sl-wa" href="https://wa.me/?text=' + encodeURIComponent(listText(rows)) + '" target="_blank" rel="noopener">' + I.send + 'Send on WhatsApp</a>' +
    '<button class="btn btn-tinted" id="sl-copy">' + I.copy + 'Copy list</button><button class="btn btn-plain" id="sl-clear">Clear list</button></div>';
}
function openSheet() { renderSheet(); sheet.hidden = false; document.body.style.overflow = 'hidden'; }
function closeSheet() { sheet.hidden = true; document.body.style.overflow = ''; }
sheet.addEventListener('click', function (e) {
  var t = e.target;
  if (t === sheet || t.closest('#sheet-close')) { closeSheet(); return; }
  var un = t.closest('[data-unlist]'); if (un) { delete state.list[un.getAttribute('data-unlist')]; save(); refreshListUI(); renderSheet(); return; }
  if (t.closest('#sl-clear')) { state.list = {}; state.have = {}; save(); refreshListUI(); renderSheet(); return; }
  if (t.closest('#sl-copy')) { copyText(listText(buildList())); }
});
sheet.addEventListener('change', function (e) {
  var i = e.target; if (!i.matches('input[data-have]')) return;
  state.have = state.have || {};
  if (i.checked) state.have[i.getAttribute('data-have')] = 1; else delete state.have[i.getAttribute('data-have')];
  save();
  var wa = document.getElementById('sl-wa'); if (wa) wa.href = 'https://wa.me/?text=' + encodeURIComponent(listText(buildList()));
});
function copyText(text) {
  var done = function () { toast('List copied'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback); else fallback();
  function fallback() { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) {} ta.remove(); }
}
var toastEl = document.getElementById('toast'), toastId = null;
function toast(msg) { toastEl.innerHTML = I.checkI + esc(msg); toastEl.hidden = false; clearTimeout(toastId); toastId = setTimeout(function () { toastEl.hidden = true; }, 1800); }

/* ===================== Share ===================== */
function shareRecipe(r) {
  var url = location.href.split('#')[0] + '#' + r.id, text = r.name + ' from My Recipe Book';
  if (navigator.share) { navigator.share({ title: r.name, text: text, url: url }).catch(function () {}); return; }
  window.open('https://wa.me/?text=' + encodeURIComponent(text + ': ' + url), '_blank', 'noopener');
}

/* ===================== Home ===================== */
function cardsHTML() {
  var q = query.trim().toLowerCase();
  var list = RECIPES.filter(function (r) {
    if (filter !== 'All' && r.course !== filter) return false;
    if (!q) return true;
    return (r.name + ' ' + r.course + ' ' + r.spec.vessel + ' ' + r.items.map(function (i) { return i[0]; }).join(' ')).toLowerCase().indexOf(q) > -1;
  });
  if (!list.length) return '<p class="empty">No recipe matches that search.</p>';
  return '<div class="grid">' + list.map(function (r, i) {
    return '<article class="card" role="link" tabindex="0" aria-label="Open ' + esc(r.name) + '" data-open="' + r.id + '" style="--i:' + i + '">' +
      '<div class="card-photo"><img src="' + r.photo + '" alt="' + esc(r.name) + ', as I cooked it" loading="lazy"></div>' +
      '<div class="card-body">' +
        '<div class="card-top"><span>' + r.course + '</span>' + stars(r.rating) + '</div>' +
        '<h2>' + r.name + '</h2><p class="card-tag">' + r.tag + '</p>' +
        '<div class="card-meta"><span>' + I.weight + r.spec.chicken + '</span><span>' + I.flame + r.spec.cook + '</span><span>' + I.pan + r.spec.vessel + '</span></div>' +
        '<div class="card-foot"><span class="when">' + vegTag(r.veg) + '<span>Cooked ' + dateStr(r.cooked) + '</span></span>' +
        '<button class="add-btn" data-addlist="' + r.id + '" aria-pressed="' + inList(r.id) + '" aria-label="Add ' + esc(r.name) + ' to shopping list">' + addBtnHTML(r.id) + '</button></div>' +
      '</div></article>';
  }).join('') + '</div>';
}
function homeView() {
  var courses = ['All'].concat(RECIPES.map(function (r) { return r.course; }).filter(function (c, i, a) { return a.indexOf(c) === i; }));
  app.innerHTML = '<div class="view">' +
    '<div class="home-top"><span class="kicker">' + RECIPES.length + ' recipes · Cooked at home</span><button class="icon-btn" data-openlist aria-label="Open shopping list">' + I.bag + badge() + '</button></div>' +
    '<h1 class="large-title">My Recipe Book</h1>' +
    '<p class="subtitle">Every dish I have cooked, written down so I can cook it again.</p>' +
    '<label class="search">' + I.search + '<input id="search" type="search" placeholder="Search dishes or ingredients" value="' + esc(query) + '" aria-label="Search recipes"></label>' +
    '<div class="segmented home-filters" role="group" aria-label="Filter by course">' + courses.map(function (c) { return '<button data-filter="' + c + '" aria-pressed="' + (c === filter) + '">' + (c === 'Starter' ? 'Starters' : c) + '</button>'; }).join('') + '</div>' +
    '<div id="cards">' + cardsHTML() + '</div></div>';
}

/* ===================== Recipe ===================== */
function recipeView(r) {
  var g = grams(r), k = g / r.base, ws = weights(r), wi = ws.indexOf(g);
  var items = r.items.map(function (it, i) {
    var key = r.id + ':i' + i;
    return '<li><label class="irow"><input type="checkbox" data-key="' + key + '"' + (state[key] ? ' checked' : '') + '>' +
      '<span class="cb">' + I.check + '</span>' +
      '<span class="iname">' + it[0] + (it[2] ? '<small>' + it[2] + '</small>' : '') + '</span>' +
      '<span class="iqty">' + scaleQty(it[1], k, it[0]) + '</span></label></li>';
  }).join('');
  var steps = r.steps.map(function (s, i) {
    var key = r.id + ':s' + i, on = !!state[key];
    var uses = s.use && s.use.length ? '<ul class="uses">' + s.use.map(function (u) { return '<li><b>' + scaleQty(u[0], k, u[1]) + '</b> ' + u[1] + '</li>'; }).join('') + '</ul>' : '';
    var tbtn = s.tm ? '<button class="timer-btn" data-timer="' + s.tm + '" data-label="' + esc(s.tl) + '">' + I.timer + 'Start ' + mins(s.tm) + ' timer</button>' : '';
    return '<li class="step' + (on ? ' done' : '') + '">' +
      '<div class="step-head"><span class="step-num">' + (i + 1) + '</span><div><p class="step-of">Step ' + (i + 1) + ' of ' + r.steps.length + '</p><h3>' + s.t + '</h3></div>' +
      '<button class="check" data-step="' + key + '" aria-pressed="' + on + '" aria-label="Mark step ' + (i + 1) + ' as done">' + I.check + '</button></div>' +
      '<div class="step-body">' + uses + '<p class="step-text">' + s.x + '</p>' + tbtn + '</div></li>';
  }).join('');
  var notes = r.notes && r.notes.length ? '<ul>' + r.notes.map(function (n) { return '<li>' + n + '</li>'; }).join('') + '</ul>' : '<p>No changes noted yet.</p>';
  var facts = [[I.weight, 'Chicken', fmtGrams(g)], [I.clock, 'Marinate', r.spec.marinate], [I.flame, 'Cook', r.spec.cook], [I.pan, 'Cooked in', r.spec.vessel]]
    .map(function (f) { return '<div class="fact">' + f[0] + '<span>' + f[1] + '</span><b>' + f[2] + '</b></div>'; }).join('');

  app.innerHTML = '<div class="view recipe" data-recipe="' + r.id + '">' +
    '<nav class="navbar" id="navbar"><button class="nav-back" data-back>' + I.back + 'Recipes</button><span class="nav-title">' + r.name + '</span>' +
      '<div class="nav-actions"><button class="icon-btn" data-share aria-label="Share recipe">' + I.share + '</button>' +
      '<button class="icon-btn" id="wake" aria-pressed="' + (!!lock) + '" aria-label="Keep screen on">' + I.sun + '</button>' +
      '<button class="icon-btn" data-openlist aria-label="Open shopping list">' + I.bag + badge() + '</button></div></nav>' +
    '<div class="r-hero"><img src="' + r.photo + '" alt="' + esc(r.name) + ', as I cooked it"></div>' +
    '<header class="r-head"><p class="r-course">' + r.course + ' · Recipe ' + r.no + '</p><h1 id="r-title">' + r.name + '</h1><p class="r-tag">' + r.tag + '</p>' +
      '<div class="r-meta">' + stars(r.rating) + '<span class="dot-sep">·</span><span>Cooked on ' + dateStr(r.cooked) + '</span><span class="dot-sep">·</span>' + vegTag(r.veg) + '</div></header>' +
    '<div class="facts">' + facts + '</div>' +
    '<div class="r-actions"><button class="btn btn-tinted" data-addlist="' + r.id + '" aria-pressed="' + inList(r.id) + '">' + addBtnHTML(r.id, true) + '</button>' +
      '<button class="btn btn-tinted" data-share>' + I.share + 'Share</button></div>' +
    '<div class="jumpbar"><div class="segmented" role="group" aria-label="Jump to section"><button data-jump="sec-ing" aria-pressed="true">Ingredients</button><button data-jump="sec-method" aria-pressed="false">Method</button></div></div>' +
    '<section class="sec" id="sec-ing"><div class="sec-head"><h2>Ingredients</h2><span class="count" id="ing-count"></span></div>' +
      '<div class="group"><div class="stepper-row"><span class="lbl"><b>Chicken</b><small>Original recipe: ' + fmtGrams(r.base) + '</small></span>' +
        '<div class="stepper"><button data-scale-step="-1" aria-label="Less chicken"' + (wi <= 0 ? ' disabled' : '') + '>−</button><output aria-live="polite">' + fmtGrams(g) + '</output><button data-scale-step="1" aria-label="More chicken"' + (wi >= ws.length - 1 ? ' disabled' : '') + '>+</button></div></div>' +
        (k !== 1 ? '<p class="scale-note">All quantities below are adjusted for ' + fmtGrams(g) + ' of chicken. Cooking times stay the same.</p>' : '') + '</div>' +
      '<div class="group"><ul class="ilist">' + items + '</ul></div>' +
      '<div class="sec-foot"><button class="text-btn" data-reset="i">Clear ticks</button></div></section>' +
    '<section class="sec" id="sec-method"><div class="sec-head"><h2>Method</h2><span class="count" id="step-count"></span></div>' +
      '<div class="progress"><i id="step-bar"></i></div>' +
      '<ol class="steps">' + steps + '</ol>' +
      '<div class="sec-foot"><button class="text-btn" data-reset="s">Clear progress</button></div>' +
      '<aside class="notes"><h3>' + I.note + 'Notes for next time</h3>' + notes + '</aside></section>' +
    '</div>';
  updateProgress(false);
}
function updateProgress(celebrate) {
  var root = app.querySelector('[data-recipe]'); if (!root) return;
  var ib = root.querySelectorAll('.irow input'), id = 0;
  ib.forEach(function (b) { if (b.checked) id++; });
  var st = root.querySelectorAll('.step'), sd = 0;
  st.forEach(function (s) { if (s.classList.contains('done')) sd++; });
  document.getElementById('ing-count').textContent = id + ' of ' + ib.length + ' ready';
  document.getElementById('step-count').textContent = sd + ' of ' + st.length + ' done';
  document.getElementById('step-bar').style.width = (st.length ? sd / st.length * 100 : 0) + '%';
  if (celebrate && sd === st.length && st.length) finished(byId(root.getAttribute('data-recipe')));
}
var doneEl = document.getElementById('done');
function finished(r) {
  document.getElementById('done-card').innerHTML = '<svg class="big" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="36"/><path d="M22 37 L32 47 L51 27"/></svg>' +
    '<h2>All done</h2><p>All ' + r.steps.length + ' steps of ' + r.name + ' are complete. Serve it hot.</p><button class="btn btn-primary" id="done-close">Close</button>';
  doneEl.hidden = false;
}
doneEl.addEventListener('click', function (e) { if (e.target === doneEl || e.target.closest('#done-close')) doneEl.hidden = true; });

/* ===================== Routing ===================== */
function render() {
  var r = byId(current);
  if (r) recipeView(r); else { current = ''; homeView(); }
  window.scrollTo(0, 0);
}
function go(id) {
  current = id;
  try { if (id) history.pushState(null, '', '#' + id); else history.pushState(null, '', location.pathname + location.search); } catch (e) {}
  render();
}
window.addEventListener('popstate', function () { try { current = (location.hash || '').slice(1); } catch (e) { current = ''; } render(); });
window.addEventListener('scroll', function () {
  var nb = document.getElementById('navbar'), tt = document.getElementById('r-title');
  if (nb && tt) nb.classList.toggle('scrolled', tt.getBoundingClientRect().bottom < 56);
  var m = document.getElementById('sec-method');
  if (m) { var inMethod = m.getBoundingClientRect().top < 160; document.querySelectorAll('[data-jump]').forEach(function (b) { b.setAttribute('aria-pressed', (b.getAttribute('data-jump') === 'sec-method') === inMethod ? 'true' : 'false'); }); }
}, { passive: true });

/* ===================== Keep screen on ===================== */
var lock = null;
function setWake(on) {
  var btn = document.getElementById('wake');
  if (!on) { if (lock) { lock.release().catch(function () {}); lock = null; } if (btn) btn.setAttribute('aria-pressed', 'false'); toast('Screen can sleep again'); return; }
  if (!('wakeLock' in navigator)) { toast('Your browser cannot keep the screen on'); return; }
  navigator.wakeLock.request('screen').then(function (l) {
    lock = l; if (btn) btn.setAttribute('aria-pressed', 'true'); toast('Screen will stay on');
    l.addEventListener('release', function () { var b = document.getElementById('wake'); if (b) b.setAttribute('aria-pressed', 'false'); lock = null; });
  }).catch(function () { toast('Your browser cannot keep the screen on'); });
}

/* ===================== Timer ===================== */
var T = { total: 0, left: 0, end: 0, id: null, paused: false, ctx: null };
var tEl = document.getElementById('timer'), tTime = document.getElementById('t-time'), tLabel = document.getElementById('t-label'),
    tPause = document.getElementById('t-pause'), tStop = document.getElementById('t-stop'), ring = document.getElementById('ring-fg');
tPause.innerHTML = I.pause; tStop.innerHTML = I.stop;
function beep() {
  if (!T.ctx) return;
  try {
    [0, .3, .6, 1.2, 1.5, 1.8].forEach(function (d) {
      var o = T.ctx.createOscillator(), g = T.ctx.createGain(), t0 = T.ctx.currentTime + d;
      o.frequency.value = 880; o.connect(g); g.connect(T.ctx.destination);
      g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.3, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .22);
      o.start(t0); o.stop(t0 + .25);
    });
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {}
}
function paint() { tTime.textContent = fmt(T.left); ring.style.strokeDashoffset = (107 * (1 - T.left / T.total)).toFixed(1); }
function tick() {
  T.left = Math.max(0, Math.round((T.end - Date.now()) / 1000)); paint();
  if (T.left === 0) {
    clearInterval(T.id); T.id = null;
    tEl.classList.add('finished'); tLabel.textContent = 'Time is up: ' + tLabel.dataset.base;
    tPause.hidden = true; tStop.innerHTML = I.x; tStop.setAttribute('aria-label', 'Close timer'); beep();
  }
}
function startTimer(sec, label) {
  try { T.ctx = T.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (T.ctx.state === 'suspended') T.ctx.resume(); } catch (e) {}
  clearInterval(T.id);
  T.total = sec; T.left = sec; T.end = Date.now() + sec * 1000; T.paused = false;
  tLabel.textContent = label; tLabel.dataset.base = label;
  tPause.hidden = false; tPause.innerHTML = I.pause; tStop.innerHTML = I.stop; tStop.setAttribute('aria-label', 'Stop timer');
  tEl.classList.remove('finished'); tEl.hidden = false;
  paint(); T.id = setInterval(tick, 500);
}
tPause.addEventListener('click', function () {
  if (T.paused) { T.end = Date.now() + T.left * 1000; T.id = setInterval(tick, 500); T.paused = false; tPause.innerHTML = I.pause; tPause.setAttribute('aria-label', 'Pause timer'); }
  else { clearInterval(T.id); T.id = null; T.paused = true; tPause.innerHTML = I.play; tPause.setAttribute('aria-label', 'Resume timer'); }
});
tStop.addEventListener('click', function () { clearInterval(T.id); T.id = null; tEl.hidden = true; });

/* ===================== Events ===================== */
app.addEventListener('click', function (e) {
  var t = e.target;
  var al = t.closest('[data-addlist]'); if (al) { e.stopPropagation(); toggleList(al.getAttribute('data-addlist')); return; }
  if (t.closest('[data-openlist]')) { openSheet(); return; }
  if (t.closest('[data-share]')) { shareRecipe(byId(current)); return; }
  if (t.closest('#wake')) { setWake(!lock); return; }
  var ss = t.closest('[data-scale-step]');
  if (ss && !ss.disabled) {
    var r = byId(current), ws = weights(r), i = ws.indexOf(grams(r)) + (+ss.getAttribute('data-scale-step'));
    if (i < 0 || i >= ws.length) return;
    var y = window.scrollY; state.sc = state.sc || {}; state.sc[r.id] = ws[i];
    if (inList(r.id)) state.list[r.id] = ws[i];
    save(); recipeView(r); window.scrollTo(0, y); return;
  }
  var j = t.closest('[data-jump]'); if (j) { document.getElementById(j.getAttribute('data-jump')).scrollIntoView({ behavior: 'smooth' }); return; }
  var open = t.closest('[data-open]'); if (open) { go(open.getAttribute('data-open')); return; }
  if (t.closest('[data-back]')) { if (lock) setWake(false); go(''); return; }
  var f = t.closest('[data-filter]'); if (f) { filter = f.getAttribute('data-filter'); app.querySelectorAll('[data-filter]').forEach(function (b) { b.setAttribute('aria-pressed', b === f ? 'true' : 'false'); }); document.getElementById('cards').innerHTML = cardsHTML(); return; }
  var tb = t.closest('[data-timer]'); if (tb) { startTimer(+tb.getAttribute('data-timer'), tb.getAttribute('data-label')); return; }
  var sb = t.closest('[data-step]');
  if (sb) {
    var key = sb.getAttribute('data-step'), li = sb.closest('.step'), on = !li.classList.contains('done');
    li.classList.toggle('done', on); sb.setAttribute('aria-pressed', on ? 'true' : 'false');
    if (on) state[key] = 1; else delete state[key];
    save(); updateProgress(on); return;
  }
  var rs = t.closest('[data-reset]');
  if (rs) {
    var root = app.querySelector('[data-recipe]'), rid = root.getAttribute('data-recipe'), kind = rs.getAttribute('data-reset');
    Object.keys(state).forEach(function (k2) { if (k2.indexOf(rid + ':' + kind) === 0) delete state[k2]; });
    save();
    if (kind === 'i') root.querySelectorAll('.irow input').forEach(function (x) { x.checked = false; });
    else root.querySelectorAll('.step').forEach(function (s) { s.classList.remove('done'); s.querySelector('[data-step]').setAttribute('aria-pressed', 'false'); });
    updateProgress(false);
  }
});
app.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.card[data-open]')) { e.preventDefault(); go(e.target.getAttribute('data-open')); }
});
app.addEventListener('change', function (e) {
  var i = e.target; if (!i.matches || !i.matches('input[data-key]')) return;
  var key = i.getAttribute('data-key');
  if (i.checked) state[key] = 1; else delete state[key];
  save(); updateProgress(false);
});
app.addEventListener('input', function (e) {
  if (e.target.id !== 'search') return;
  query = e.target.value;
  document.getElementById('cards').innerHTML = cardsHTML();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSheet(); doneEl.hidden = true; } });

try { current = (location.hash || '').slice(1); } catch (e) { current = ''; }
render();
</script>
</body>
</html>
